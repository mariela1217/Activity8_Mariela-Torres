<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ARIA Accessibility Exercise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f7f8;
      color: #222222;
    }

    header,
    main {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 25px;
      color: #167d86;
      font-size: 2rem;
    }

    h2 {
      margin-bottom: 20px;
      color: #264653;
      font-size: 1.4rem;
    }

    form {
      width: 100%;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }

    fieldset {
      margin: 0;
      padding: 20px;
      border: 2px solid #178c8c;
      border-radius: 6px;
    }

    legend {
      padding: 0 8px;
      color: #264653;
      font-weight: bold;
    }

    .form-control {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }

    label {
      display: inline-block;
      width: fit-content;
      margin-bottom: 7px;
      color: #264653;
      font-weight: bold;
    }

    .field-icon {
      display: inline-block;
      font-size: 1.3rem;
      line-height: 1;
      margin-right: 6px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #666666;
      border-radius: 5px;
      background-color: #ffffff;
      color: #222222;
      font-family: inherit;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      outline: 3px solid #005fcc;
      outline-offset: 3px;
      border-color: #005fcc;
    }

    input[type="submit"] {
      padding: 10px 20px;
      border: 2px solid #176b64;
      border-radius: 5px;
      background-color: #176b64;
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #10544f;
      border-color: #10544f;
    }

    input[type="submit"]:focus-visible {
      outline: 3px solid #005fcc;
      outline-offset: 3px;
    }

    .contact-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 25px;
      font-size: 1rem;
    }

    .phone-icon {
      font-size: 1.2rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>Accessibility exercises</h1>
  </header>

  <main>

    <h2>ARIA exercise 1</h2>

    <form>

      <fieldset>

        <legend>Contact us</legend>

        <!-- NAME -->
        <div class="form-control">

          <label for="name">

            <span
              class="field-icon"
              aria-hidden="true">
              👤
            </span>

            <span class="sr-only">
              Name
            </span>

          </label>

          <input
            type="text"
            id="name"
            name="name"
            autocomplete="name">

        </div>


        <!-- EMAIL -->
        <div class="form-control">

          <label for="email">

            <span
              class="field-icon"
              aria-hidden="true">
              ✉️
            </span>

            <span class="sr-only">
              E-mail
            </span>

          </label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email">

        </div>


        <!-- MESSAGE -->
        <div class="form-control">

          <label for="message">

            <span
              class="field-icon"
              aria-hidden="true">
              💬
            </span>

            <span class="sr-only">
              Message
            </span>

          </label>

          <textarea
            id="message"
            name="message"
            rows="8"></textarea>

        </div>


        <!-- SUBMIT -->
        <input
          type="submit"
          value="Send">

      </fieldset>

    </form>


    <!-- PHONE -->
    <div class="contact-info">

      <span
        class="phone-icon"
        aria-hidden="true">
        ☎
      </span>

      <span>
        <span class="sr-only">
          Phone:
        </span>

        +52 (333) 45 34 567
      </span>

    </div>

  </main>

</body>

</html>
